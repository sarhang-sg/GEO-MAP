
[package]
name = "nav-kurd"
version = "9.0.0"
description = "NAV KURD native Windows map application"
authors = ["Sarhang Salah"]
license = "Proprietary"
repository = "https://github.com/sarhang-sg/GEO-MAP"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nav_kurd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3" }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
url = "2"
