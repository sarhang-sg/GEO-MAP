name: NAV KURD native Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "data-src/**"
      - "public/**"
      - "api/assetlinks.js"
      - "capacitor.config.ts"
      - "package*.json"
      - ".gitattributes"
      - "tools/**"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "data-src/**"
      - "public/**"
      - "api/assetlinks.js"
      - "capacitor.config.ts"
      - "package*.json"
      - ".gitattributes"
      - "tools/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nav-kurd-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install and synchronize Android
        run: npm ci && npm run android:sync

      - name: Verify Android source contract
        run: npm run verify:platform

      - name: Decode optional release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
        run: echo "$KEYSTORE_B64" | base64 --decode > android/app/release.keystore

      - name: Build release AAB and APK
        working-directory: android
        env:
          NAV_KURD_ANDROID_KEYSTORE_PATH: "${{ github.workspace }}/android/app/release.keystore"
          NAV_KURD_ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          NAV_KURD_ANDROID_KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
          NAV_KURD_ANDROID_KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Upload Android release
        uses: actions/upload-artifact@v4
        with:
          name: nav-kurd-android-release
          retention-days: 14
          if-no-files-found: error
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
