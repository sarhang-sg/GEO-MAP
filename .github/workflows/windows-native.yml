name: NAV KURD native Windows

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "data-src/**"
      - "public/**"
      - "package*.json"
      - ".gitattributes"
      - "tools/**"
      - ".github/workflows/windows-native.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "data-src/**"
      - "public/**"
      - "package*.json"
      - ".gitattributes"
      - "tools/**"
      - ".github/workflows/windows-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nav-kurd-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - name: Configure deterministic Git checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install, verify and build MSI/NSIS
        shell: pwsh
        run: |
          npm ci
          npm run verify:platform
          npm run windows:bundle

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: nav-kurd-windows-installers
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
