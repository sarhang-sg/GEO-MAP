name: NAV KURD verified backend cleanup
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact already-verified web release commit
        required: true
        type: string
      older_than:
        description: Original coordinated release start time in UTC
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nav-kurd-backend-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify current source before cleanup
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_COMMIT"
      - name: Verify and remove obsolete owned app functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          OLDER_THAN: ${{ inputs.older_than }}
        run: python3 tools/release/verify-backend.py --cleanup --expected-commit "$EXPECTED_COMMIT" --older-than "$OLDER_THAN"
      - name: Retain current cleanup evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nav-kurd-backend-cleanup-report
          if-no-files-found: error
          path: ${{ runner.temp }}/NAV-KURD-BACKEND-REPORT.json
