
<!doctype html><html lang="ku" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAV KURD</title><style>@font-face{font-family:"NAVKurd Arabic";src:url("fonts/UniQAIDAR-Money-Heist-002.ttf") format("truetype");font-style:normal;font-weight:400 900;font-display:block}html,body{margin:0;height:100%;background:#090d19;color:#fff;font-family:"NAVKurd Arabic",Tahoma,Arial,sans-serif}main{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}img{width:92px;height:92px;border-radius:22px;box-shadow:0 0 34px rgba(154,48,190,.38)}h1{font-size:22px;margin:14px 0 5px}p{color:#c7bed0;margin:0;line-height:1.6}.spinner{width:28px;height:28px;margin:18px auto;border:3px solid #33243d;border-top-color:#a348bd;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(1turn)}}#actions{display:none;gap:8px;margin-top:16px}button{border:1px solid #82499a;border-radius:10px;padding:9px 14px;background:#542565;color:#fff;font:inherit;cursor:pointer}</style></head><body><main><div><img src="assets/nav-kurd-logo.png" alt="NAV KURD"><h1 id="title">NAV KURD</h1><p id="message">خەریکە ماپەکە ئامادە دەکرێت…</p><div id="spinner" class="spinner"></div><div id="actions"><button id="retry">دووبارە هەوڵدان</button><button id="settings">ڕێکخستنەکان</button></div></div></main><script type="module">const core=window.__TAURI__?.core;const event=window.__TAURI__?.event;event?.listen('nav-kurd-native-error',({payload})=>{document.querySelector('#title').textContent=payload.title;document.querySelector('#message').textContent=payload.message;document.querySelector('#retry').textContent=payload.retryLabel;document.querySelector('#settings').textContent=payload.settingsLabel;document.querySelector('#spinner').style.display='none';document.querySelector('#actions').style.display='flex'});document.querySelector('#retry').onclick=()=>core?.invoke('retry_app');document.querySelector('#settings').onclick=()=>core?.invoke('open_location_settings');</script></body></html>
